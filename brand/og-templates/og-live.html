<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1200"/>
<meta name="robots" content="noindex,nofollow"/>
<title>OG card: live · PrivacyPal</title>
<link rel="icon" href="../../assets/favicon.ico" sizes="any"/>
<link rel="icon" href="../../assets/brand/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="../../apple-touch-icon.png"/>
<meta name="theme-color" content="#01204E"/>
<link rel="stylesheet" href="../../assets/v3.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="kit.css"/>
<!-- Renders assets/brand/og/og-live.png (1200x630): the share card for every PrivacyPal Live
     event link (live/?e=<id>). One card for all events, because link previews are read from
     the static page, so it names no event: the invitation itself, on the emperor penguin
     photograph (news/images/privacy-penguin-brand.jpg; Denis Luyten, Wikimedia Commons,
     public domain, brand grade). Per-event images come from the Studio (Invite and share). -->
<style>
  .k-copy{width:560px}
  .k-photo img{object-position:74% 62%}
</style>
</head>
<body>
<div class="k-canvas k-og ground-navy">
  <div class="k-photo" style="--photo-left:420px;--wash-solid:3%;--wash-fade:44%">
    <img src="../../news/images/privacy-penguin-brand.jpg" alt=""/>
  </div>
  <div class="k-og-top" style="width:560px">
    <img class="k-logo" src="../../assets/brand/logo-white.svg" alt="PrivacyPal"/>
  </div>
  <div class="k-og-body k-copy">
    <span class="k-eyebrow" style="font-size:18px">PrivacyPal Live</span>
    <h1 class="k-h" style="font-size:72px;margin-top:22px">You&rsquo;re <span class="k-ul">invited</span>.</h1>
    <p class="k-sub" style="font-size:24px;margin-top:22px;max-width:520px">A live session on AI, privacy and the work that depends on both. Free to join.</p>
  </div>
  <div class="k-og-foot" style="width:560px;margin-top:30px">
    <span class="k-mono" style="font-size:16px">Online · in person · on demand</span>
    <span class="k-url" style="font-size:19px">privacypal.ai/live</span>
  </div>
</div>
</body>
</html>
