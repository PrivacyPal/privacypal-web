<!-- Renders assets/brand/og/og-family.png (1200x630). PrivacyPal for families (the Family pack).

<style>
  .k-copy{width:550px}
  .k-photo img{object-position:11% 30%}
</style>

<body>
<div class="k-canvas k-og ground-navy">
  <div class="k-photo k-grade" style="--photo-left:430px;--wash-solid:22%;--wash-fade:33%">
    <img src="../../family/assets/photos/study-together.jpg" data-standin="assets/photos/pack-family.jpg" alt=""/>

    <img class="k-logo" src="../../assets/brand/logo-white.svg" alt="PrivacyPal"/>

  <div class="k-og-body k-copy">
    <span class="k-eyebrow" style="font-size:18px">PrivacyPal for families</span>
    <h1 class="k-h" style="font-size:62px;margin-top:22px">Their world is full of AI. <span class="text-gold">You hold the&nbsp;keys.</span></h1>
    <p class="k-sub" style="font-size:21px;margin-top:22px;max-width:520px">Guardrails for the AI your kids use, with their identity protected on the device.</p>
  </div>
  <div class="k-og-foot" style="width:550px;margin-top:30px">
    <span class="k-mono" style="font-size:16px">$9.99/month · up to 5 family members</span>
    <span class="k-url" style="font-size:19px">privacypal.ai</span>
  </div>
</div>
