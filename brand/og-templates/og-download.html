<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1200"/>
<meta name="robots" content="noindex,nofollow"/>
<title>OG card: download · PrivacyPal</title>
<link rel="icon" href="../../assets/favicon.ico" sizes="any"/>
<link rel="icon" href="../../assets/brand/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="../../apple-touch-icon.png"/>
<meta name="theme-color" content="#01204E"/>
<link rel="stylesheet" href="../../assets/v3.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Renders assets/brand/og/og-download.png (1200x630). One download for every platform. No versions on the card.
     Phones are protected today with the Family or Max pack, installed by invitation (no public store
     listing yet); Personal has no phones. Linux is the Max headless agent. -->
<style>
  .k-head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
  .k-oss{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:38px}
  .k-os{border-radius:16px;padding:20px 18px 18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16)}
  .k-os svg{width:30px;height:30px;color:#fff;display:block}
  .k-os b{display:block;margin-top:16px;font-size:20px;font-weight:500;letter-spacing:-.01em;line-height:1.15}
  .k-os span{display:block;margin-top:6px;font-family:var(--font-mono);font-size:13.5px;color:#b9c6dc;letter-spacing:.02em}
  .k-os span + span{margin-top:3px}
  .k-os.k-phones{grid-column:span 2}
  .k-os .k-icos{display:flex;gap:10px}
</style>
</head>
<body>
<div class="k-canvas k-og ground-navy">
  <div class="k-rings" style="--rings-x:92%;--rings-y:8%;--rings-size:1000px;--ring-a:.05"></div>
  <div class="k-og-top">
    <img class="k-logo" src="../../assets/brand/logo-white.svg" alt="PrivacyPal"/>
    <span class="k-eyebrow" style="font-size:18px">Download</span>
  </div>
  <div class="k-og-body">
    <div class="k-head">
      <div>
        <h1 class="k-h" style="font-size:72px">One download. Free to&nbsp;start.</h1>
        <p class="k-sub" style="font-size:22px;margin-top:18px">Personal is included. Add Family or Max in the same app.</p>
      </div>
      <span class="k-btn" style="font-size:22px;margin-bottom:6px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        Download free
      </span>
    </div>
    <div class="k-oss">
      <div class="k-os">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        <b>Mac</b><span>Apple Silicon</span>
      </div>
      <div class="k-os">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 4.5L10.5 3.5V11H3V4.5ZM11.5 3.35L21 2V11H11.5V3.35ZM3 12H10.5V20.5L3 19.5V12ZM11.5 12H21V22L11.5 20.65V12Z"/></svg>
        <b>Windows</b><span>Windows 11</span>
      </div>
      <div class="k-os">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 3h18a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm1 4v12h16V7H4zm2.7 2.3 3.3 3.3-3.3 3.3 1.4 1.4 4.7-4.7-4.7-4.7-1.4 1.4zM13 15h5v2h-5v-2z"/></svg>
        <b>Linux</b><span>Max headless agent</span>
      </div>
      <div class="k-os k-phones">
        <div class="k-icos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.6"/><path d="M10.5 18.5h3"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.6"/><path d="M6 6h12M6 17.5h12"/></svg>
        </div>
        <b>iPhone, iPad and Android</b><span>Protected today with Family or Max</span><span>Install by invitation</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
