<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1200"/>
<meta name="robots" content="noindex,nofollow"/>
<title>OG card: home · PrivacyPal</title>
<link rel="icon" href="../../assets/favicon.ico" sizes="any"/>
<link rel="icon" href="../../assets/brand/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="../../apple-touch-icon.png"/>
<meta name="theme-color" content="#01204E"/>
<link rel="stylesheet" href="../../assets/v3.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css"/>
<!-- Renders assets/brand/og/og-home.png (1200x630). The three doors: you, your family, your business. -->
<style>
  .k-doors{position:absolute;right:56px;top:56px;bottom:80px;width:520px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .k-door{position:relative;border-radius:20px;overflow:hidden;background:#0e3364}
  .k-door:nth-child(2){margin-top:30px;margin-bottom:-30px}
  .k-door img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.92) contrast(1.04) sepia(.08)}
  .k-door::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,32,78,0) 48%,rgba(1,32,78,.86) 100%)}
  .k-door figcaption{position:absolute;left:16px;right:12px;bottom:16px;z-index:1;font-size:20px;font-weight:500;letter-spacing:-.012em;line-height:1.15;white-space:nowrap}
  .k-door figcaption span{display:flex;align-items:center;gap:8px;margin-top:6px;font-family:var(--font-mono);font-size:13.5px;font-weight:500;letter-spacing:.02em;color:#c9d4e6}
  .k-door figcaption span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot);flex:none}
  .k-copy{width:540px}
</style>
</head>
<body>
<div class="k-canvas k-og ground-navy">
  <div class="k-rings" style="--rings-x:28%;--rings-y:118%;--rings-size:1100px;--ring-a:.045"></div>
  <div class="k-og-top" style="width:540px">
    <img class="k-logo" src="../../assets/brand/logo-white.svg" alt="PrivacyPal"/>
  </div>
  <div class="k-og-body k-copy">
    <span class="k-eyebrow" style="font-size:18px">One app · three packs</span>
    <h1 class="k-h" style="font-size:62px;margin-top:22px">One app for you, your family and your&nbsp;business.</h1>
    <p class="k-sub" style="font-size:23px;margin-top:22px;max-width:520px">We protect your data from AI, at home and at work. Personal is <span class="k-ul">free</span>.</p>
  </div>
  <div class="k-og-foot" style="width:540px;border-top:0;padding-top:0;margin-top:30px">
    <span class="k-url" style="font-size:19px">privacypal.ai</span>
  </div>
  <div class="k-doors">
    <figure class="k-door" style="--dot:var(--teal)">
      <img src="../../assets/hero-shot-accounting.png" data-standin="assets/photos/hero-you.jpg" alt="" style="object-position:72% 50%"/>
      <figcaption>You<span>Personal</span></figcaption>
    </figure>
    <figure class="k-door" style="--dot:var(--gold)">
      <img src="../../family/assets/photos/homework-boy.jpg" data-standin="assets/photos/hero-home.jpg" alt="" style="object-position:22% 50%"/>
      <figcaption>Your family<span>Family</span></figcaption>
    </figure>
    <figure class="k-door" style="--dot:#fff">
      <img src="../../assets/hero-shot-banking.png" data-standin="assets/photos/hero-work.jpg" alt="" style="object-position:30% 70%"/>
      <figcaption>Your business<span>Max</span></figcaption>
    </figure>
  </div>
</div>
</body>
</html>
