<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1200"/>
<meta name="robots" content="noindex,nofollow"/>
<title>OG card: business · PrivacyPal</title>
<link rel="icon" href="../../assets/favicon.ico" sizes="any"/>
<link rel="icon" href="../../assets/brand/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="../../apple-touch-icon.png"/>
<meta name="theme-color" content="#01204E"/>
<link rel="stylesheet" href="../../assets/v3.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Renders assets/brand/og/og-business.png (1200x630). PrivacyPal for business (the Max pack).
     The file keeps its og-business name: business.html and the other business pages link it by that path.
     Stand-in: partners/max-hero.jpg, the Max stand-in the brochure and the Max partner one-pager use too,
     so one team fronts Max everywhere and no Personal model appears on a Max card. -->
<style>
  .k-copy{width:600px}
  .k-photo img{object-position:70% 40%}
  /* Stand-in only: soften the whiteboard writing behind the copy, the wall sign and the laptop's maker mark. */
  .k-photo img.k-soft{--soft-blur:6px;--soft-mask:
    linear-gradient(90deg,#000 0,#000 30%,rgba(0,0,0,0) 40%),
    radial-gradient(18% 14% at 43% 25%,#000 60%,rgba(0,0,0,0) 100%),
    radial-gradient(3.2% 3.8% at 50.7% 74.6%,#000 55%,rgba(0,0,0,0) 100%)}
</style>
</head>
<body>
<div class="k-canvas k-og ground-navy">
  <div class="k-photo k-grade" style="--photo-left:460px;--wash-solid:4%;--wash-fade:46%">
    <img src="../../partners/max-hero.jpg" data-standin="assets/photos/pack-business.jpg" alt=""/>
    <img class="k-soft" src="../../partners/max-hero.jpg" data-standin-only="assets/photos/pack-business.jpg" alt=""/>
  </div>
  <div class="k-og-top" style="width:600px">
    <img class="k-logo" src="../../assets/brand/logo-white.svg" alt="PrivacyPal"/>
  </div>
  <div class="k-og-body k-copy">
    <span class="k-eyebrow" style="font-size:18px">PrivacyPal for business</span>
    <h1 class="k-h" style="font-size:66px;margin-top:22px">Privacy and governance for <span class="k-ul">every&nbsp;AI</span> at&nbsp;work.</h1>
    <p class="k-sub" style="font-size:22px;margin-top:22px;max-width:540px">The same technology that protects 140+ companies.</p>
  </div>
  <div class="k-og-foot" style="width:600px;margin-top:30px">
    <span class="k-mono" style="font-size:16px">Max · $34/user/mo · Copilot · Claude Code</span>
    <span class="k-url" style="font-size:19px">privacypal.ai</span>
  </div>
</div>
</body>
</html>
