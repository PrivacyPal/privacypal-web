<!-- Renders the 400x400 social avatar from the app icon, full bleed (platforms crop to a circle):
     assets/brand/app-icon.svg -> assets/brand/social/avatar-400.png
     One tile: white. The gold tile is retired (the emoji's beak and feet are the same gold and vanish
     on it), and so is the navy tile (the emoji's dark body sits at about 1.2:1 on Deep Navy, so at
     avatar size the penguin reads as a white egg with a beak).
     The tile color also fills the canvas, so the icon's rounded corners disappear into it.
     Open with ?circle to preview the circle crop. -->
<style>
  html,body{background:transparent}
  .k-av{width:400px;height:400px;background:var(--tile)}
  .k-av img{position:absolute;inset:0;width:100%;height:100%}
  .k-av.k-circle{border-radius:50%}
</style>
</head>
<body>
<div class="k-canvas k-av" id="av" style="--tile:#fff">
  <img id="icon" src="../../assets/brand/app-icon.svg" alt="PrivacyPal"/>
</div>
<script>
  (function () {
    if (new URLSearchParams(location.search).has('circle')) {
      document.getElementById('av').classList.add('k-circle');
    }
  })();
</script>
</body>
</html>
