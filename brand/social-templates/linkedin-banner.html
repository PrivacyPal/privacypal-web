<link rel="icon" href="../../assets/brand/favicon.svg" type="image/svg+xml"/>

<!-- Renders assets/brand/social/linkedin-banner-1128x191.png (and the @2x file).
     LinkedIn places the company logo over the lower left of the banner: keep the left 300px quiet. -->
<style>
  .k-lb{width:1128px;height:191px;box-sizing:border-box;padding:0 56px 0 316px;display:flex;align-items:center;justify-content:space-between;gap:32px}
  .k-lb .k-h{font-size:33px;line-height:1.1;letter-spacing:-.028em;white-space:nowrap}
  .k-lb .k-sub{font-size:15.5px;margin-top:12px;white-space:nowrap}
</style>
</head>
<body>
<div class="k-canvas k-lb ground-navy">
  <div class="k-rings" style="--rings-x:2%;--rings-y:50%;--rings-size:760px;--ring-gap:34px;--ring-a:.06"></div>
  <div>
    <h1 class="k-h">We protect your data <span class="k-ul">from&nbsp;AI</span>,<br/>at home and at work.</h1>
    <p class="k-sub">The same technology that protects 140+ companies.</p>
  </div>
  <div style="text-align:right;flex:none">
    <span class="k-mono" style="display:block;font-size:13.5px">Personal · Family · Max</span>
    <span class="k-url" style="display:block;font-size:16px;margin-top:10px">privacypal.ai</span>
  </div>
</div>
</body>
</html>
