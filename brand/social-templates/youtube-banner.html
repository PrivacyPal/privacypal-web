<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Social: YouTube banner · PrivacyPal</title>
<link rel="icon" href="../../assets/favicon.ico" sizes="any"/>
<link rel="icon" href="../../assets/brand/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="../../apple-touch-icon.png"/>
<meta name="theme-color" content="#01204E"/>
<link rel="stylesheet" href="../../assets/v3.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../og-templates/kit.css"/>
<!-- Renders assets/brand/social/youtube-banner-2560x1440.png.
     Safe area (shown on every device): 1546 x 423, centered, so x 507 to 2053 and y 508 to 931.
     Desktop shows the full-width band y 508 to 931; TV shows the whole image.
     Open with ?guides to outline the safe area and the desktop band. -->
<style>
  .k-yt{width:2560px;height:1440px}
  .k-safe{position:absolute;left:507px;top:508px;width:1546px;height:423px;box-sizing:border-box;padding:0 44px;display:flex;align-items:center;justify-content:space-between;gap:56px}
  .k-safe .k-copy{flex:1;min-width:0}
  .k-safe .k-logo{--logo-h:54px}
  .k-safe .k-h{font-size:78px;margin-top:34px}
  .k-safe .k-sub{font-size:28px;margin-top:22px}
  .k-doors{flex:none;width:440px;height:330px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .k-door{position:relative;border-radius:22px;overflow:hidden;background:#0e3364;margin:0}
  .k-door:nth-child(2){margin-top:20px;margin-bottom:-20px}
  .k-door img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.92) contrast(1.04) sepia(.08)}
  .k-door::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,32,78,0) 50%,rgba(1,32,78,.86) 100%)}
  .k-door figcaption{position:absolute;left:14px;right:10px;bottom:16px;z-index:1;font-size:18px;font-weight:500;letter-spacing:-.012em;line-height:1.15;white-space:nowrap}
  .k-door figcaption span{display:flex;align-items:center;gap:8px;margin-top:6px;font-family:var(--font-mono);font-size:13px;font-weight:500;letter-spacing:.02em;color:#c9d4e6}
  .k-door figcaption span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot);flex:none}
  .k-url{position:absolute;right:56px;bottom:52px}
  /* review guides (?guides) */
  .k-guides .k-band{position:absolute;left:0;right:0;top:508px;height:423px;outline:3px dashed rgba(255,172,51,.8);outline-offset:-3px;pointer-events:none}
  .k-guides .k-safe{outline:3px solid rgba(255,172,51,.95);outline-offset:0}
</style>
</head>
<body>
<div class="k-canvas k-yt ground-navy" id="yt">
  <div class="k-rings" style="--rings-x:50%;--rings-y:50%;--rings-size:2600px;--ring-gap:64px;--ring-a:.045"></div>
  <div class="k-band" hidden></div>
  <div class="k-safe">
    <div class="k-copy">
      <img class="k-logo" src="../../assets/brand/logo-white.svg" alt="PrivacyPal"/>
      <h1 class="k-h">We protect your data <span class="k-ul">from&nbsp;AI</span>,<br/>at home and at work.</h1>
      <p class="k-sub">The same technology that protects 140+ companies.</p>
    </div>
    <div class="k-doors">
      <figure class="k-door" style="--dot:var(--teal)">
        <img src="../../assets/hero-shot-accounting.png" data-standin="assets/photos/hero-you.jpg" alt="" style="object-position:72% 50%"/>
        <figcaption>You<span>Personal</span></figcaption>
      </figure>
      <figure class="k-door" style="--dot:var(--gold)">
        <img src="../../family/assets/photos/homework-boy.jpg" data-standin="assets/photos/hero-home.jpg" alt="" style="object-position:22% 50%"/>
        <figcaption>Your family<span>Family</span></figcaption>
      </figure>
      <figure class="k-door" style="--dot:#fff">
        <img src="../../assets/hero-shot-banking.png" data-standin="assets/photos/hero-work.jpg" alt="" style="object-position:30% 70%"/>
        <figcaption>Your business<span>Max</span></figcaption>
      </figure>
    </div>
  </div>
</div>
<script>
  if (new URLSearchParams(location.search).has('guides')) {
    document.getElementById('yt').classList.add('k-guides');
    document.querySelector('.k-band').hidden = false;
  }
</script>
</body>
</html>
